<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14100c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Selera Kampung</title>
<style>
:root{--bg:#0c0a08;--card:#1b1510;--ink:#f1e6d3;--mute:#b3a58c;--leaf:#d9a95b;--free:#25663d;--busy:#b83a24;--kunyit:#e8b04a;--line:#3a2d1c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:150px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{padding:16px 16px 6px;display:flex;align-items:flex-start;gap:10px}
header>div{flex:1}
h1{margin:0;font-size:1.5rem;letter-spacing:-.01em;font-family:"Playfair Display",Georgia,"Times New Roman",serif}
header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
h2{font-size:1rem;margin:14px 16px 8px}
.legend{display:flex;gap:14px;padding:6px 16px;color:var(--mute);font-size:.85rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.floor{display:grid;gap:8px;padding:10px 16px}
.cell{aspect-ratio:1;border-radius:14px;min-width:0}
.ecell{border:2px dashed var(--line);background:none;color:var(--mute);font:inherit;font-size:1.3rem;cursor:pointer}
.tbl{border:0;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;overflow:hidden}
.tbl.free{background:var(--free)}.tbl.busy{background:var(--busy)}
.tbl b{font-size:var(--fs,2rem);line-height:1}
.tbl span{font-size:.7rem;opacity:.95}
.tbl.sel{outline:4px solid var(--kunyit);outline-offset:2px}
.tbl:active{transform:scale(.96)}
.door{margin:6px 16px;padding:8px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--mute);font-size:.85rem}
.steps,.chips{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
.step,.chip{flex:1 0 auto;text-align:center;padding:8px 10px;border-radius:10px;background:var(--card);border:2px solid var(--line);font:inherit;font-size:.82rem;font-weight:600;color:var(--mute)}
.chip{cursor:pointer}
.step.on,.chip.on{background:var(--leaf);border-color:var(--leaf);color:#2a1d0a}
.step.done{color:var(--leaf);border-color:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
.item{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 12px;text-align:left;font:inherit;cursor:pointer;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.item:active{transform:scale(.97)}
.item span{color:var(--mute);font-size:.82rem}
.item.free{border-style:dashed}
.item.on{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,var(--card))}
.item.on span,.ftag{color:var(--leaf)!important;font-weight:600}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 16px 6px}
.row .n{flex:1}.row small{display:block;color:var(--mute)}
.row .p{font-weight:700;font-variant-numeric:tabular-nums}
.row button{border:0;background:none;color:var(--busy);font-size:1.3rem;cursor:pointer;padding:2px 6px}
.empty{margin:0 16px;color:var(--mute);padding:14px;border:2px dashed var(--line);border-radius:12px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:560px;margin:auto}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tot small{color:var(--mute)}.tot strong{font-size:1.7rem;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:2px solid var(--leaf);background:var(--leaf);color:#2a1d0a;border-radius:12px;padding:13px 10px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--leaf)}
.btn.pay,.btn.del{background:var(--busy);border-color:var(--busy);color:#fff}
.btn.small{flex:0 0 auto;padding:10px 14px}
.ask{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 16px 10px}
.card .top{display:flex;gap:8px;margin-bottom:8px}
.fld{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;min-width:0}
.sz{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
.sz-box{position:relative;display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:8px}
.sz-hd{display:flex;align-items:center;justify-content:space-between;gap:4px}
.sz small{color:var(--mute);font-size:.78rem}
.sz-del{border:0;background:rgba(184,58,36,.2);color:#ff8a75;border-radius:7px;width:24px;height:24px;font-size:1rem;line-height:1;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.sz-del:active{background:var(--busy);color:#fff}
.sz-acts{display:flex;gap:8px;margin-top:8px}
.sz-acts .btn{padding:9px 10px;font-size:.84rem}
.msg{margin:0 16px 8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--kunyit) 25%,var(--card));font-size:.9rem}
.stp{display:flex;align-items:center;gap:8px;margin:6px 16px}
.stp span{flex:1}.stp button{width:42px;height:42px;border-radius:10px;border:2px solid var(--leaf);background:none;color:var(--leaf);font-size:1.3rem;font-weight:700;cursor:pointer}
.hint{margin:0 16px 6px;color:var(--mute);font-size:.88rem}
.row .w{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;min-width:36px;height:36px;font-size:1rem;font-weight:700;padding:0 8px;margin:6px 6px 0 0}
.row .w[data-on]{background:var(--leaf);border-color:var(--leaf);color:#2a1d0a}
.row .pb{background:var(--busy);color:#fff;border-radius:10px;padding:9px 14px;font-size:.95rem;font-weight:700}
.bg2{flex:1;border:2px solid var(--leaf);background:none;color:var(--leaf);border-radius:12px;padding:13px 10px;font:inherit;font-weight:700;cursor:pointer}
.bp{flex:1;border:2px solid var(--busy);background:var(--busy);color:#fff;border-radius:12px;padding:13px 10px;font:inherit;font-weight:700;cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:14px 4px;font:inherit;cursor:pointer;text-align:center}
.size b{display:block}.size span{color:var(--busy);font-weight:700}
.size:active{background:var(--kunyit);color:#23301f}.size:active span{color:#23301f}
.cancel{margin-top:12px;width:100%;border:0;background:none;color:var(--mute);font:inherit;padding:10px;cursor:pointer}
.shell{margin:10px 12px;border:1px solid #3a2d1c;border-radius:28px;background:#14100c;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px;background:#1a1410;border-bottom:1px solid #2c2216}
.logo{width:44px;height:44px;border-radius:14px;background:#2a2014;border:1px solid #5a4421;display:grid;place-items:center;color:#e2b866;flex:0 0 auto}
.logo svg,.ebtn svg,.fc svg,.zone svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:1.3rem;color:#f3e7d1;line-height:1.1}
.ttl p{margin:3px 0 0;color:#bfae92;font-size:.74rem;line-height:1.25}
.acts{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #4a3a22;background:#1c1611;color:#d8c9ae;border-radius:999px;padding:6px 10px;font-size:.75rem;font-weight:600}
.pill .d{width:9px;height:9px;border-radius:50%}
.ebtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #8a6a2e;background:#221a10;color:#e2b866;border-radius:12px;padding:7px 11px;font:inherit;font-weight:700;font-size:.82rem;cursor:pointer}
.ebtn svg{width:16px;height:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;align-items:center}
.fc{display:inline-flex;align-items:center;gap:7px;border:1px solid #4a3a22;background:#1c1611;color:#eadcc2;border-radius:999px;padding:8px 13px;font:inherit;font-weight:600;font-size:.82rem;cursor:pointer}
.fc svg{width:16px;height:16px}
.fc.on{background:#d9a95b;border-color:#d9a95b;color:#2a1d0a}
.fc .sq{width:13px;height:13px;border-radius:4px;border:2px solid;display:inline-block}
.fc .sq.g{border-color:#3fae60;background:#25663d}.fc .sq.r{border-color:#d9503a;background:#b83a24}
.fc .n{background:rgba(0,0,0,.2);border-radius:999px;padding:1px 8px}
.bil{margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid #4a3a22;border-radius:999px;padding:8px 13px;color:#cdbd9f;font-size:.82rem}
.bil b{color:#e2b866;font-size:.95rem}
.bil svg{width:18px;height:18px;color:#e2b866;fill:none;stroke:currentColor;stroke-width:1.8}
.zone{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 2px;color:#bfae92;font-size:.82rem;border-top:1px solid #2c2216}
.zone span:first-child{display:flex;align-items:center;gap:8px}
.zone svg{color:#3fae60;width:16px;height:16px}
.clock{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.floor.board{gap:12px;padding:12px 14px 18px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 2px,transparent 2px 7px),#17120d}
.tc{position:relative;aspect-ratio:1;width:100%;border-radius:20px;border:1.5px solid;color:#f3e7d1;font:inherit;cursor:pointer;display:block;overflow:hidden;padding:0;min-width:0}
.tc.free{background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),linear-gradient(160deg,#27683f,#1a4a2b);border-color:#2f7a4a}
.tc.busy{background:linear-gradient(180deg,#b8402a,#8c2117);border-color:#d19a3a}
.tc.sel{outline:3px solid #e2b866;outline-offset:2px}
.tc.dim{opacity:.18;pointer-events:none}
.tc:active{transform:scale(.97)}
.tc .tl{position:absolute;left:11px;top:10px;display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:#e8b04a}
.tc .tl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tc.free .tl{color:#7fcf98}
.tc .tr{position:absolute;right:11px;top:11px;font-size:.7rem;color:#f3e7d1}
.tc .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tc .no{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:var(--fs,2rem);font-weight:500;line-height:1}
.tc .st{font-size:.8rem;color:#bcd6c2}
.tc .pp{background:#6b1810;border:1px solid #d19a3a;border-radius:10px;padding:2px 9px;font-weight:700;font-size:.78rem}
.tc .bd{position:absolute;bottom:12px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#3fae60}
.tc .bb{position:absolute;bottom:12px;left:50%;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:#e0a233}
.step{cursor:pointer}
#lock{position:fixed;inset:0;z-index:50;background:#0c0a08;display:none;align-items:center;justify-content:center;padding:24px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#lock .lk{width:100%;max-width:320px;text-align:center}
.lkt{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:1.6rem;color:#f3e7d1}
.lks{color:#b3a58c;margin:6px 0 18px;font-size:.9rem}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:10px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid #8a6a2e;display:inline-block;transition:background-color .06s ease,border-color .06s ease,transform .06s ease}
.dots i.on{background:#d9a95b;border-color:#d9a95b;transform:scale(1.12)}
.lkm{min-height:1.3em;color:#e0705a;font-size:.85rem;margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;touch-action:manipulation}
.pad button{aspect-ratio:1.4;border-radius:16px;border:1.5px solid #3a2d1c;background:#1b1510;color:#f1e6d3;font:inherit;font-size:1.5rem;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .04s ease,background-color .04s ease}
.pad button:active,.pad button.pressed{background:#d9a95b;color:#2a1d0a;border-color:#d9a95b;transform:scale(.95)}
.lkcancel{margin-top:16px;width:100%;border:1.5px solid #3a2d1c;background:none;color:#b3a58c;border-radius:12px;padding:11px;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.lkcancel:active{background:#1b1510;color:#f1e6d3}
.pinf{-webkit-text-security:disc;text-security:disc}
.qrw{padding:8px 16px;text-align:center}
.qrimg{width:100%;max-width:340px;background:#fff;padding:12px;border-radius:16px}
.qrt{color:var(--mute);margin-top:14px}
.qra{font-size:2.2rem;font-weight:700;color:var(--leaf)}
.row .pq{background:none;border:1.5px solid var(--leaf);color:var(--leaf);border-radius:10px;padding:8px 12px;font-size:.9rem;font-weight:700}
.rcw{padding:16px}
#rcpt{background:#fff;color:#000;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.35;max-width:320px;margin:0 auto;padding:14px 12px;border:1px dashed #999}
#rcpt .c{text-align:center}#rcpt .t{font-size:16px;font-weight:700;text-align:center}
#rcpt .r{display:flex;justify-content:space-between;gap:8px}
#rcpt hr{border:0;border-top:1px dashed #000;margin:8px 0}
#rcpt .tot{font-weight:700;font-size:15px}
html.lt{filter:invert(1) hue-rotate(180deg)}html.lt img,html.lt #rcpt{filter:invert(1) hue-rotate(180deg)}
.tc .dr{position:absolute;left:8px;bottom:8px;background:#e8b04a;color:#2a1d0a;border-radius:8px;padding:1px 7px;font-size:.68rem;font-weight:700}
.btn.pulse{animation:bpu 1.8s infinite}@keyframes bpu{50%{box-shadow:0 0 0 6px rgba(217,169,91,.4)}}
.dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:8px 6px;font-size:1.3rem;color:var(--mute);line-height:1}.card.drg{opacity:.5;outline:2px dashed var(--leaf)}.card.over{box-shadow:0 -5px 0 var(--leaf)}
.chk{width:38px;height:38px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--card);color:#2a1d0a;font-size:1.2rem;font-weight:700;padding:0;margin-right:4px}.chk.on{background:var(--leaf);border-color:var(--leaf)}.card.pk{outline:2px solid var(--leaf)}
#dropbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:6px;padding:8px 10px;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--leaf)}#dropbar span{flex:none;font-size:.8rem;color:var(--mute)}#dropbar b{flex:none;padding:10px 12px;border:2px dashed var(--line);border-radius:10px;font-size:.85rem;color:var(--ink)}#dropbar b.over{background:var(--leaf);border-style:solid;color:#2a1d0a}
.sz-box.drg{opacity:.5;outline:2px dashed var(--leaf)}.sz-box.over{box-shadow:-5px 0 0 var(--leaf)}
.tc.old{border-color:#ffd24a;animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:inset 0 0 0 4px #ffd24a}}
@media print{html.lt,html.lt img,html.lt #rcpt{filter:none}.bar,header,.sheet-bg{display:none!important}body{background:#fff;padding:0;max-width:none}.rcw{padding:0}#rcpt{border:0;max-width:none;padding:0}}
</style>
</head>
